[package]
name = "skew-mmr"
version = "0.1.0"
edition = "2024"

[features]
default = ["r1cs"]
r1cs = ["dep:ark-ff", "dep:ark-r1cs-std", "dep:ark-relations"]

[dependencies]
ark-ff = { version = "0.6", optional = true }
ark-r1cs-std = { version = "0.6", optional = true }
ark-relations = { version = "0.6", optional = true }

[dev-dependencies]
ark-bn254 = "0.6"
ark-std = "0.6"
alloy = { version = "2.5.0", features = [
    "node-bindings",
    "provider-http",
    "contract",
    "sol-types",
] }
criterion = { version = "0.8.2", default-features = false, features = [
    "cargo_bench_support",
] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "hashes"
path = "benches/hashes/main.rs"
harness = false
